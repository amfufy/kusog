<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4F57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kusog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Kusog Fit Quest</title>
<style>
:root{
  --bg:#E7F0EC;--surface:#FFFFFF;--surface2:#D6E5DE;--ink:#132F2D;--muted:#4D6864;--line:#C3D7CF;
  --sea:#0E4F57;--hero:#0E4F57;--hero-ink:#F2F8F5;--hero-muted:#B5D2CD;
  --hill:#8A5A2B;--grass:#5F8F32;--mango:#E3A21A;--mango-ink:#3A2600;--danger:#B23B2A;--ok:#3F7F22;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A2023;--surface:#11302F;--surface2:#193F3F;--ink:#E3EFEA;--muted:#9BB7B0;--line:#264B4B;
    --sea:#6CC6CC;--hero:#0D3A40;--hill:#A9733F;--grass:#86BD55;--mango:#F0B83C;--danger:#E58370;--ok:#8DC45F;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
h1,h2,h3,.num,.tabs b{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}

/* Hero */
.hero{margin:0 -16px 18px;background:var(--hero);color:var(--hero-ink);padding:18px 20px 0;border-radius:0 0 28px 28px;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.5px}
.rank{color:var(--hero-muted);font-size:15px;margin-top:2px}
.streak{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.xp{margin-top:14px}
.xp-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.xp-bar i{display:block;height:100%;background:var(--mango);border-radius:6px;transition:width .5s ease}
.xp small{display:flex;justify-content:space-between;color:var(--hero-muted);margin-top:5px;font-size:13px}
.hills{display:block;width:calc(100% + 40px);margin:10px -20px 0;height:auto}
.climb{font-size:14px;color:var(--hero-muted);margin:6px 0 0;padding-bottom:14px}

/* Generic */
h2{font-size:21px;margin:26px 0 10px;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.panel{background:var(--surface);border-radius:20px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;white-space:nowrap;background:var(--sea);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#062226}}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
input[type=number],input[type=text]{width:100%;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
input:focus{border-color:var(--sea);outline:none}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}

/* Day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.daynav strong{font-size:18px}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);font-size:22px;line-height:1}
.navbtn:disabled{opacity:.3}

/* Meters */
.meter+.meter{margin-top:14px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mrow b{font-size:22px}
.bar{height:14px;background:var(--surface2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s ease}
.bar .under{background:var(--mango)}
.bar .ok{background:var(--grass)}
.bar .over{background:var(--danger)}
.note{font-size:14px;margin-top:10px;color:var(--muted)}

/* Meals */
.meals{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:20px}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.meal+.meal{border-top:1px solid var(--line)}
.check{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:transparent;font-size:22px;font-weight:700;display:grid;place-items:center;transition:transform .15s}
.check.on{background:var(--grass);border-color:var(--grass);color:#fff}
.check:active{transform:scale(.9)}
.meal h3{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.meal p{margin:2px 0 0;font-size:16px;line-height:1.3}
.meal .macro{font-size:13px;color:var(--muted);margin-top:3px}
.swap{border:0;background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}

/* Habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;min-height:84px}
.habit.on{border-color:var(--grass);background:color-mix(in srgb,var(--grass) 14%,var(--surface))}
.habit span{font-size:24px}
.habit b{display:block;margin-top:4px}
.habit small{color:var(--muted)}
.water{grid-column:1/-1;background:var(--surface);border-radius:18px;padding:14px}
.drops{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.drop{flex:1 0 32px;height:40px;border:0;border-radius:10px;background:var(--surface2);font-size:18px;filter:grayscale(1);opacity:.5}
.drop.on{filter:none;opacity:1;background:color-mix(in srgb,var(--sea) 22%,var(--surface))}

/* Extras */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px}
.xlist{list-style:none;padding:0;margin:12px 0 0}
.xlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.x{border:0;background:none;color:var(--danger);font-size:20px;width:36px;height:36px}
.custom{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.custom .btn{grid-column:1/-1}

/* XP breakdown */
.xpline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xpline span{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--surface2);color:var(--muted)}
.xpline span.got{background:color-mix(in srgb,var(--mango) 30%,var(--surface));color:var(--ink);font-weight:600}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px}
.stat b{display:block;font-size:24px;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.stat small{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
td:first-child,th:first-child{text-align:left}
.tip{background:color-mix(in srgb,var(--mango) 22%,var(--surface));border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px}

/* Groceries */
.glist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:20px}
.glist li+li{border-top:1px solid var(--line)}
.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;background:none;text-align:left}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff}
.gitem.on .box{background:var(--grass);border-color:var(--grass)}
.gitem.on .gname{text-decoration:line-through;color:var(--muted)}
.gitem small{display:block;color:var(--muted);font-size:13px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--surface);border-radius:18px;padding:14px;text-align:center}
.badge .ic{font-size:34px;display:block}
.badge b{display:block;margin-top:6px;font-size:15px}
.badge small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.badge.locked .ic{filter:grayscale(1);opacity:.35}
.badge.locked b{color:var(--muted)}
.pbar{height:6px;background:var(--surface2);border-radius:4px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--mango)}

/* Settings */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack>*+*{margin-top:10px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:104px;border:0;background:none;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.tabs span{font-size:22px;line-height:1.1}
.tabs b{font-size:12px;font-weight:600}
.tabs button[aria-current=page]{color:var(--ink);background:var(--surface2)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><span>🍽️</span><b>Today</b></button>
  <button data-tab="progress"><span>📈</span><b>Progress</b></button>
  <button data-tab="groceries"><span>🧺</span><b>Market</b></button>
  <button data-tab="badges"><span>🏅</span><b>Badges</b></button>
  <button data-tab="settings"><span>⚙️</span><b>Settings</b></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const niceDate = d => `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;

/* ---------- Food plan ---------- */
const BREAKFAST = [
  {t: '3 boiled eggs, sautéed greens, ½ cup rice', k: 385, p: 20},
  {t: '40 g oats, 1 scoop whey, 1 boiled egg', k: 345, p: 35}
];
const SNACK = [
  {t: '1 cup monggo, 2 eggs, banana or papaya', k: 500, p: 27},
  {t: '1 cup monggo, 1 scoop whey, banana or papaya', k: 475, p: 38}
];
const ROT = {
  0: {l: {t: '2 cans tuna in water, vegetables, 1 cup rice', k: 470, p: 54}, d: {t: 'Fish sinigang (tilapia or galunggong), 1 cup rice', k: 430, p: 40}},
  1: {l: {t: 'Chicken adobo (simmered, no oil), 1 cup rice, vegetables', k: 490, p: 50}, d: {t: 'Tilapia sinigang, 1 cup rice', k: 420, p: 40}},
  2: {l: {t: 'Grilled bangus, 1 cup rice, vegetables', k: 540, p: 44}, d: {t: 'Chicken tinola, 1 cup rice', k: 420, p: 40}},
  3: {l: {t: 'Garlic-calamansi chicken, 1 cup rice, vegetables', k: 490, p: 50}, d: {t: 'Galunggong paksiw, 1 cup rice, vegetables', k: 440, p: 40}},
  4: {l: {t: 'Grilled or steamed tilapia, 1 cup rice, vegetables', k: 470, p: 48}, d: {t: 'Chicken tinola with malunggay, 1 cup rice', k: 420, p: 40}},
  5: {l: {t: 'Chicken adobo (simmered, no oil), 1 cup rice, vegetables', k: 490, p: 50}, d: {t: '1 can tuna in water, 1 boiled egg, sautéed vegetables, 1 cup rice', k: 470, p: 40}},
  6: {l: {t: 'Grilled bangus, 1 cup rice, vegetables', k: 540, p: 44}, d: {t: 'Chicken soup with sayote, 1 cup rice', k: 420, p: 40}}
};
const SLOTS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['snack', 'Post-workout snack'], ['dinner', 'Dinner']];
const opts = (slot, date) => {
  const r = ROT[date.getDay()];
  return slot === 'breakfast' ? BREAKFAST : slot === 'snack' ? SNACK : slot === 'lunch' ? [r.l] : [r.d];
};
const QUICK = [
  {t: 'Boiled egg', k: 72, p: 6}, {t: 'Scoop of whey', k: 120, p: 24}, {t: 'Lakatan banana', k: 90, p: 1},
  {t: '½ cup rice', k: 100, p: 2}, {t: 'Can of tuna in water', k: 140, p: 28}, {t: 'Papaya slice', k: 60, p: 1},
  {t: '1 tsp oil', k: 40, p: 0}
];
const GROC = [
  ['Skinless chicken breast', '~1.1 kg', 320], ['Tilapia', '~1.2 kg', 200], ['Bangus', '2 medium (~0.8 kg)', 180],
  ['Galunggong', '~0.5 kg', 120], ['Tuna in water', '3 cans', 120], ['Eggs', '36 pcs', 340],
  ['Monggo (dry)', '400 g', 55], ['Rice', '~1.1 kg', 60], ['Pechay, kangkong, malunggay', 'assorted', 70],
  ['Cabbage, carrots, sayote', 'assorted', 100], ['Sinigang vegetables + sampalok mix', 'assorted', 90],
  ['Talong, ampalaya', 'assorted', 40], ['Ginger, garlic, onion', 'assorted', 50], ['Bananas + 1 papaya', '7 + 1', 100],
  ['Calamansi, vinegar, soy, salt, oil', 'top-ups', 40], ['Purified water', '~2 refills', 105]
];

/* ---------- State ---------- */
const KEY = 'kusog_v1';
const DEF = {settings: {kcal: 1800, protein: 140, start: 125, goal: 100, budget: 9200}, days: {}, weights: [], grocery: {week: '', checked: {}}, spend: [], badges: {}, lastLevel: null};
const clone = o => JSON.parse(JSON.stringify(o));
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return Object.assign(clone(DEF), d, {settings: Object.assign(clone(DEF.settings), d.settings || {})});
    }
  } catch (e) {}
  return clone(DEF);
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Couldn’t save. Free up storage on your phone and try again.'); }
}
let tab = 'today';
let off = 0; // days back from today on the Today tab

const day = (k, create) => {
  if (!S.days[k] && create) S.days[k] = {meals: {}, extras: [], walk: false, strength: false, water: 0};
  return S.days[k];
};

/* ---------- Scoring ---------- */
function stat(k) {
  const d = S.days[k], date = fromKey(k), st = S.settings;
  let kcal = 0, p = 0, meals = 0;
  if (d) {
    for (const [slot] of SLOTS) {
      const m = d.meals[slot];
      if (m && m.done) {
        const o = opts(slot, date); const f = o[m.v || 0] || o[0];
        kcal += f.k; p += f.p; meals++;
      }
    }
    for (const x of d.extras) { kcal += x.k; p += x.p; }
  }
  const walk = !!(d && d.walk), strength = !!(d && d.strength), water = d ? d.water : 0;
  const pOK = p >= st.protein - 10;
  const kOK = meals > 0 && kcal >= st.kcal - 150 && kcal <= st.kcal + 150;
  const perfect = meals === 4 && pOK && kOK && walk && water >= 8;
  const xp = meals * 10 + (pOK ? 30 : 0) + (kOK ? 30 : 0) + (walk ? 20 : 0) + (strength ? 20 : 0) + (water >= 8 ? 10 : 0) + (perfect ? 25 : 0);
  return {kcal, p, meals, walk, strength, water, pOK, kOK, goal: pOK && kOK, perfect, xp};
}
const sortedWeights = () => [...S.weights].sort((a, b) => a.d < b.d ? -1 : 1);
const currentWeight = () => { const w = sortedWeights(); return w.length ? w[w.length - 1].kg : S.settings.start; };

function agg() {
  const keys = Object.keys(S.days).sort();
  const a = {xp: 0, meals: 0, perfect: 0, proteinDays: 0, walks: 0, strength: 0, waterDays: 0, best: 0, streak: 0};
  let run = 0, prev = null;
  for (const k of keys) {
    const s = stat(k);
    a.xp += s.xp; a.meals += s.meals; a.perfect += s.perfect ? 1 : 0; a.proteinDays += s.pOK && s.meals ? 1 : 0;
    a.walks += s.walk ? 1 : 0; a.strength += s.strength ? 1 : 0; a.waterDays += s.water >= 8 ? 1 : 0;
    if (s.goal) { run = (prev && keyOf(addDays(fromKey(k), -1)) === prev) ? run + 1 : 1; a.best = Math.max(a.best, run); prev = k; }
    else { run = 0; prev = null; }
  }
  let d = today();
  if (!stat(keyOf(d)).goal) d = addDays(d, -1);
  while (stat(keyOf(d)).goal) { a.streak++; d = addDays(d, -1); }
  a.weighIns = S.weights.length;
  a.xp += a.weighIns * 25;
  a.lost = Math.max(0, S.settings.start - currentWeight());
  return a;
}
const levelOf = xp => { let L = 1; while (xp >= 50 * L * (L + 1)) L++; return L; };
const RANKS = [[1, 'Rookie'], [3, 'Steady stepper'], [5, 'Hill climber'], [8, 'Trailblazer'], [12, 'Island strong'], [16, 'Chocolate Hills legend']];
const rankOf = L => RANKS.filter(r => L >= r[0]).pop()[1];

const BADGES = [
  {id: 'first', ic: '🍳', n: 'First bite', d: 'Log your first meal', key: 'meals', need: 1},
  {id: 'perfect1', ic: '⭐', n: 'Perfect day', d: 'Hit every daily goal in one day', key: 'perfect', need: 1},
  {id: 'perfect10', ic: '🌟', n: 'Ten perfect days', d: 'Have 10 perfect days', key: 'perfect', need: 10},
  {id: 'streak3', ic: '🔥', n: '3-day streak', d: 'Hit calories and protein 3 days in a row', key: 'best', need: 3},
  {id: 'streak7', ic: '🔥', n: 'Full week', d: '7-day streak', key: 'best', need: 7},
  {id: 'streak14', ic: '🔥', n: 'Two weeks strong', d: '14-day streak', key: 'best', need: 14},
  {id: 'streak30', ic: '🌋', n: 'Unstoppable', d: '30-day streak', key: 'best', need: 30},
  {id: 'protein7', ic: '🍗', n: 'Protein pro', d: 'Hit your protein on 7 days', key: 'proteinDays', need: 7},
  {id: 'protein30', ic: '🐟', n: 'Protein machine', d: 'Hit your protein on 30 days', key: 'proteinDays', need: 30},
  {id: 'walk10', ic: '👟', n: 'Trail regular', d: 'Finish 10 walks', key: 'walks', need: 10},
  {id: 'walk50', ic: '🏝️', n: 'Island walker', d: 'Finish 50 walks', key: 'walks', need: 50},
  {id: 'str10', ic: '🏋️', n: 'Strength habit', d: 'Finish 10 strength sessions', key: 'strength', need: 10},
  {id: 'water14', ic: '💧', n: 'Well watered', d: 'Drink 8 glasses on 14 days', key: 'waterDays', need: 14},
  {id: 'weigh4', ic: '⚖️', n: 'Weekly check-in', d: 'Log 4 weigh-ins', key: 'weighIns', need: 4},
  {id: 'kg1', ic: '⛰️', n: 'First kilo', d: 'Lose 1 kg', key: 'lost', need: 1},
  {id: 'kg5', ic: '🏔️', n: 'Five down', d: 'Lose 5 kg', key: 'lost', need: 5},
  {id: 'kg10', ic: '🏔️', n: 'Ten down', d: 'Lose 10 kg', key: 'lost', need: 10},
  {id: 'kg20', ic: '🚩', n: 'Twenty down', d: 'Lose 20 kg', key: 'lost', need: 20},
  {id: 'goal', ic: '🏆', n: 'Summit', d: 'Reach your goal weight', key: 'lost', need: null}
];
const needOf = b => b.need === null ? Math.max(0.1, S.settings.start - S.settings.goal) : b.need;

function rewards(beforeLevel) {
  const a = agg(); const L = levelOf(a.xp); const msgs = [];
  if (beforeLevel !== null && L > beforeLevel) msgs.push(`Level up! You’re level ${L}, ${rankOf(L)}`);
  for (const b of BADGES) {
    if (!S.badges[b.id] && a[b.key] >= needOf(b)) { S.badges[b.id] = keyOf(today()); msgs.push(`${b.ic} Badge unlocked: ${b.n}`); }
  }
  S.lastLevel = L;
  save();
  msgs.forEach((m, i) => setTimeout(() => toast(m), 900 + i * 2600));
}

/* ---------- Toast ---------- */
let tt;

  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- Hero ---------- */
function hillY(x) {
  const B = [[30, 34], [95, 28], [160, 44], [228, 30], [300, 40]]; let y = 112;
  for (const [c, h] of B) y -= h * Math.exp(-(((x - c) / 30) ** 2));
  return y;
}
function hillsSVG(p) {
  let top = '';
  for (let x = 0; x <= 360; x += 6) top += `${x === 0 ? 'M' : 'L'}${x} ${hillY(x).toFixed(1)} `;
  const mx = 14 + p * 328, my = hillY(mx) - 10, fx = 344, fy = hillY(fx);
  return `<svg class="hills" viewBox="0 0 360 120" aria-hidden="true">
    <path d="${top}L360 120 L0 120Z" fill="var(--hill)"/>
    <path d="${top}" fill="none" stroke="var(--grass)" stroke-width="4" stroke-linejoin="round"/>
    <line x1="${fx}" y1="${fy - 2}" x2="${fx}" y2="${fy - 30}" stroke="var(--hero-ink)" stroke-width="2"/>
    <path d="M${fx} ${fy - 30} L${fx + 14} ${fy - 25} L${fx} ${fy - 20}Z" fill="var(--mango)"/>
    <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="8" fill="var(--mango)" stroke="var(--hero-ink)" stroke-width="2.5"/>
  </svg>`;
}
function hero() {
  const a = agg(), L = levelOf(a.xp), lo = 50 * (L - 1) * L, hi = 50 * L * (L + 1);
  const st = S.settings, cur = currentWeight(), span = st.start - st.goal;
  const p = span > 0 ? Math.min(1, Math.max(0, (st.start - cur) / span)) : 0;
  const left = Math.max(0, cur - st.goal);
  return `<header class="hero">
    <div class="hero-top">
      <div><h1>Level ${L}</h1><div class="rank">${rankOf(L)}</div></div>
      <div class="streak">${a.streak ? `🔥 ${a.streak}-day streak` : 'Start a streak today'}</div>
    </div>
    <div class="xp"><div class="xp-bar"><i style="width:${((a.xp - lo) / (hi - lo) * 100).toFixed(1)}%"></i></div>
      <small><span>${fmt(a.xp)} XP</span><span>${fmt(hi - a.xp)} XP to level ${L + 1}</span></small></div>
    ${hillsSVG(p)}
    <p class="climb">${left > 0 ? `${fmt(cur, 1)} kg now, ${fmt(left, 1)} kg to your ${fmt(st.goal, 1)} kg summit` : `You reached your ${fmt(st.goal, 1)} kg summit! Set a new goal in Settings.`}</p>
  </header>`;
}

}

function chartSVG(ws, goal) {
  if (ws.length < 2) return '<p class="muted small">Log at least two weigh-ins to see your chart.</p>';
  const W = 320, H = 150, P = 26;
  const t0 = fromKey(ws[0].d).getTime(), t1 = fromKey(ws[ws.length - 1].d).getTime() || t0 + 1;
  const vals = ws.map(w => w.kg).concat([goal]);
  let lo = Math.min(...vals) - 1, hi = Math.max(...vals) + 1;
  const X = t => P + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - P - 8);
  const Y = v => 8 + (hi - v) / (hi - lo) * (H - 30);
  const pts = ws.map(w => `${X(fromKey(w.d).getTime()).toFixed(1)},${Y(w.kg).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart">
    <line x1="${P}" x2="${W - 8}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--mango)" stroke-dasharray="5 5" stroke-width="2"/>
    <text x="${W - 8}" y="${Y(goal) - 5}" text-anchor="end" font-size="11" fill="var(--muted)">goal ${fmt(goal, 1)}</text>
    <text x="0" y="${Y(hi - 1) + 4}" font-size="11" fill="var(--muted)">${fmt(hi - 1)}</text>
    <text x="0" y="${Y(lo + 1) + 4}" font-size="11" fill="var(--muted)">${fmt(lo + 1)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--sea)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map(w => `<circle cx="${X(fromKey(w.d).getTime()).toFixed(1)}" cy="${Y(w.kg).toFixed(1)}" r="3.5" fill="var(--sea)"/>`).join('')}
  </svg>`;
}
function vProgress() {

    const kgs = recent.map(w => w.kg);
    if (spanDays >= 14 && Math.max(...kgs) - Math.min(...kgs) < 0.3)

const weekKey = () => { const d = today(); const dow = (d.getDay() + 6) % 7; return keyOf(addDays(d, -dow)); };
function vGroceries() {

const VIEWS = {today: vToday, progress: vProgress, groceries: vGroceries, badges: vBadges, settings: vSettings};
function render() {
  $('#app').innerHTML = VIEWS[tab]();

/* ---------- Actions ---------- */
const num = id => parseFloat(($('#' + id) || {}).value);
function act(a, ds) {
  const before = levelOf(agg().xp);
  const k = keyOf(addDays(today(), -off));
  let keepScroll = true;
  switch (a) {
    case 'prev': off = Math.min(off + 1, 60); break;
    case 'next': off = Math.max(off - 1, 0); break;
    case 'eat': { const d = day(k, true), m = d.meals[ds.slot] || (d.meals[ds.slot] = {done: false, v: 0}); m.done = !m.done; if (m.done) toast('+10 XP'); break; }
    case 'swap': { const d = day(k, true), m = d.meals[ds.slot] || (d.meals[ds.slot] = {done: false, v: 0}); m.v = ((m.v || 0) + 1) % opts(ds.slot, fromKey(k)).length; break; }
    case 'walk': { const d = day(k, true); d.walk = !d.walk; if (d.walk) toast('👟 +20 XP'); break; }
    case 'strength': { const d = day(k, true); d.strength = !d.strength; if (d.strength) toast('🏋️ +20 XP'); break; }
    case 'water': { const d = day(k, true), n = +ds.n; d.water = d.water === n ? n - 1 : n; if (d.water === 8) toast('💧 Water goal hit, +10 XP'); break; }
    case 'addq': day(k, true).extras.push({...QUICK[+ds.i]}); break;
    case 'addc': {
      const t = ($('#cName').value || '').trim(), kc = num('cK'), p = num('cP') || 0;
      if (!t || !(kc >= 0)) { toast('Enter a food name and its calories.'); return; }
      day(k, true).extras.push({t: t.slice(0, 60), k: Math.round(kc), p: Math.round(p)}); break;
    }
    case 'delx': day(k, true).extras.splice(+ds.i, 1); break;
    case 'weigh': {
      const kg = num('wKg');
      if (!(kg > 30 && kg < 400)) { toast('Enter your weight in kg, like 123.4'); return; }
      const tk = keyOf(today()); S.weights = S.weights.filter(w => w.d !== tk); S.weights.push({d: tk, kg: Math.round(kg * 10) / 10});
      toast('⚖️ Weigh-in logged, +25 XP'); break;
    }
    case 'delw': S.weights = S.weights.filter(w => w.d !== ds.d); break;
    case 'gro': S.grocery.checked[ds.i] = !S.grocery.checked[ds.i]; break;
    case 'spend': {
      const amt = num('spAmt');
      if (!(amt > 0)) { toast('Enter how much you spent.'); return; }
      S.spend.push({d: keyOf(today()), amt: Math.round(amt * 100) / 100}); toast('Spending added'); break;
    }
    case 'delsp': S.spend.splice(+ds.i, 1); break;
    case 'saveset': {
      const v = {kcal: num('sK'), protein: num('sP'), start: num('sS'), goal: num('sG'), budget: num('sB')};
      if (!(v.kcal >= 1200 && v.kcal <= 4000)) { toast('Set daily calories between 1,200 and 4,000.'); return; }
      if (!(v.protein >= 40 && v.protein <= 300)) { toast('Set protein between 40 and 300 g.'); return; }
      if (!(v.start > 30 && v.goal > 30)) { toast('Enter your starting and goal weight in kg.'); return; }
      if (!(v.budget >= 0)) { toast('Enter your monthly budget in pesos.'); return; }
      S.settings = v; toast('Settings saved'); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
      const u = URL.createObjectURL(blob), el = document.createElement('a');
      el.href = u; el.download = `kusog-backup-${keyOf(today())}.json`; document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000); return;
    }
    case 'import': $('#importFile').click(); return;
    case 'wipe':
      if (!confirm('Erase all your Kusog data on this phone? This can’t be undone.')) return;
      S = clone(DEF); off = 0; save(); render(); toast('All data erased'); return;
    default: return;
  }
  if (a === 'prev' || a === 'next') keepScroll = false;
  const y = window.scrollY;
  save(); rewards(before); render();
  if (keepScroll) window.scrollTo(0, y);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; if (tab === 'today') off = 0; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.act, b.dataset);
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || !d.settings || !d.days) throw new Error('bad');
    S = Object.assign(clone(DEF), d, {settings: Object.assign(clone(DEF.settings), d.settings)});
    save(); render(); toast('Backup restored');
  } catch (err) { toast('That file isn’t a Kusog backup. Pick the .json file you downloaded.'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ---------- Start ---------- */
if (S.lastLevel === null) { S.lastLevel = levelOf(agg().xp); save(); }
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
