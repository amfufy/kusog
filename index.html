<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050913">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kusog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="chakra-600.woff2" as="font" type="font/woff2" crossorigin>
<title>Kusog Fit Quest</title>
<style>
@font-face{font-family:"Chakra Petch";src:url(chakra-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(chakra-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url(chakra-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#050913;--surface:#0C1428;--surface2:#15203C;--ink:#E6F4FF;--muted:#8DA2C0;--line:#1E3157;
  --cyan:#2EE6F0;--sea:#2EE6F0;--magenta:#FF3DA8;--mango:#FFB547;--grass:#45F5A1;--ok:#45F5A1;--danger:#FF5470;
  --hero:#08101F;--hero-ink:#E6F4FF;--hero-muted:#8DA2C0;
  --glow-c:0 0 18px rgba(46,230,240,.35);--glow-m:0 0 18px rgba(255,61,168,.35);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{color:var(--ink);font:16px/1.45 "Chakra Petch",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(900px 500px at 100% -5%,rgba(255,61,168,.13),transparent 60%),radial-gradient(800px 500px at -10% 15%,rgba(46,230,240,.10),transparent 60%),var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-weight:700;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Today header */
.hero{margin:0 -16px 18px;padding:18px 20px 0;color:var(--hero-ink);border-bottom:1px solid rgba(46,230,240,.35);
  background:linear-gradient(rgba(46,230,240,.06) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(46,230,240,.06) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(180deg,#0A1530,#060b18);overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{margin:0;font-size:34px;line-height:1;text-shadow:0 0 16px rgba(46,230,240,.55)}
.rank{color:var(--cyan);font-size:15px;margin-top:4px;font-weight:600}
.hero-pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.streak{border:1px solid rgba(255,181,71,.45);color:var(--mango);border-radius:8px;padding:5px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.coinpill{border:1px solid rgba(46,230,240,.45);background:rgba(46,230,240,.08);color:var(--cyan);border-radius:8px;padding:5px 10px;font-weight:700;font-size:14px}
.xp{margin-top:14px}
.xp-bar{height:8px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--mango));box-shadow:0 0 12px rgba(255,61,168,.6);transition:width .5s ease}
.xp small{display:flex;justify-content:space-between;color:var(--hero-muted);margin-top:5px;font-size:13px}
.hills{display:block;width:calc(100% + 40px);margin:8px -20px 0;height:auto}
.hills .ridge{filter:drop-shadow(0 0 4px rgba(46,230,240,.9))}
.hills .me{filter:drop-shadow(0 0 6px rgba(255,181,71,.9))}
.climb{font-size:14px;color:var(--hero-muted);margin:6px 0 0;padding-bottom:14px}

/* Generic */
h2{font-size:20px;margin:26px 0 10px}
h2:first-child{margin-top:0}
.panel{background:linear-gradient(180deg,rgba(21,32,60,.9),rgba(12,20,40,.9));border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 16px;background:var(--cyan);color:#031018;font-weight:700;white-space:nowrap;box-shadow:var(--glow-c)}
.btn:disabled{background:var(--surface2);color:var(--muted);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 0 18px rgba(255,84,112,.35)}
.btn.small{padding:8px 12px;font-size:14px}
input[type=number],input[type=text]{width:100%;min-width:0;border:1px solid var(--line);background:#070D1C;border-radius:8px;padding:10px 12px}
input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(46,230,240,.15)}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}

/* Day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.daynav strong{font-size:18px}
.navbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.navbtn:disabled{opacity:.3}

/* Meters */
.meter+.meter{margin-top:14px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mrow b{font-size:22px}
.bar{height:10px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .4s ease}
.bar .under{background:var(--mango);box-shadow:0 0 10px rgba(255,181,71,.6)}
.bar .ok{background:var(--grass);box-shadow:0 0 10px rgba(69,245,161,.6)}
.bar .over{background:var(--danger);box-shadow:0 0 10px rgba(255,84,112,.6)}
.note{font-size:14px;margin-top:10px;color:var(--muted)}

/* Meals */
.meals{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px}
.meal+.meal{border-top:1px solid var(--line)}
.check{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#070D1C;font-size:22px;font-weight:700;display:grid;place-items:center;transition:transform .15s}
.check.on{background:var(--grass);border-color:var(--grass);color:#03140c;box-shadow:0 0 14px rgba(69,245,161,.5)}
.check:active{transform:scale(.9)}
.meal h3{margin:0;font-size:14px;color:var(--cyan);font-weight:600}
.meal p{margin:2px 0 0;font-size:16px;line-height:1.3}
.meal .macro{font-size:13px;color:var(--muted);margin-top:3px}
.swap{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}

/* Habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;min-height:84px}
.habit.on{border-color:var(--grass);box-shadow:inset 0 0 0 1px var(--grass),0 0 16px rgba(69,245,161,.2)}
.habit span{font-size:24px}
.habit b{display:block;margin-top:4px}
.habit small{color:var(--muted)}
.water{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.drops{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.drop{flex:1 0 32px;height:40px;border:1px solid var(--line);border-radius:8px;background:#070D1C;font-size:18px;filter:grayscale(1);opacity:.45}
.drop.on{filter:none;opacity:1;border-color:var(--cyan);box-shadow:0 0 10px rgba(46,230,240,.3)}

/* Extras */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:14px}
.chip.mine{border-color:rgba(46,230,240,.5);color:var(--cyan)}
.xlist{list-style:none;padding:0;margin:12px 0 0}
.xlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.x{border:0;background:none;color:var(--danger);font-size:20px;width:36px;height:36px}
.custom{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.custom .btn{grid-column:1/-1}
.chk{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.xpline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xpline span{font-size:13px;border-radius:6px;padding:4px 9px;border:1px solid var(--line);color:var(--muted)}
.xpline span.got{border-color:rgba(255,181,71,.6);color:var(--mango);font-weight:600}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}
.stat small{color:var(--muted);font-size:13px;display:block}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;text-align:right;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
td:first-child,th:first-child{text-align:left}
.tip{border:1px solid rgba(255,181,71,.45);background:rgba(255,181,71,.08);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}

/* Market */
.glist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.glist li+li{border-top:1px solid var(--line)}
.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;background:none;text-align:left}
.box{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:#03140c}
.gitem.on .box{background:var(--grass);border-color:var(--grass)}
.gitem.on .gname{text-decoration:line-through;color:var(--muted)}
.gitem small{display:block;color:var(--muted);font-size:13px}
.gedrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:12px 16px;align-items:center}
.gedrow>input:first-child{grid-column:1/-1}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.badge:not(.locked){border-color:rgba(255,181,71,.5);box-shadow:0 0 14px rgba(255,181,71,.12)}
.badge .ic{font-size:34px;display:block}
.badge b{display:block;margin-top:6px;font-size:15px}
.badge small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.badge.locked .ic{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.pbar{height:5px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--mango)}

/* Train */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ex>b{display:block;font-size:17px}
.ex small{display:block;margin-top:2px;font-size:14px}
.last{margin-top:8px;padding:8px 10px;border-radius:8px;border-left:2px solid var(--cyan);background:rgba(46,230,240,.06)}
.sets{list-style:none;padding:0;margin:8px 0 0}
.sets li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:2px 0;font-size:15px}
.setrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.picks{display:grid;gap:10px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left}
.pick.next{border-color:var(--cyan);box-shadow:var(--glow-c)}
.pick b{display:block;font-size:17px}
.pick small{color:var(--muted);display:block;margin-top:4px;font-size:14px}
.tag{font-size:12px;font-weight:700;background:var(--cyan);color:#031018;border-radius:4px;padding:2px 7px;margin-left:8px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--cyan)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--grass)}
.rt td{vertical-align:middle}
.rt td:not(:first-child),.rt th:not(:first-child){text-align:center;width:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack>*+*{margin-top:10px}

/* Plan editor */
details.panel{margin-top:10px}
summary{font-weight:600;cursor:pointer;font-size:17px}
details[open] summary{margin-bottom:8px}
.edrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.edrow>input[type=text]{grid-column:1/-1}
.edn{display:flex;align-items:center;gap:4px}
.edn span{font-size:13px;color:var(--muted)}
.edn input{min-width:0}
.dayed{padding:12px 0;border-top:1px solid var(--cyan)}
.lbl{font-size:13px;color:var(--muted);margin-top:8px}
.warn{color:var(--danger);font-weight:600}
select{width:100%;margin-top:6px;border:1px solid var(--line);background:#070D1C;border-radius:8px;padding:8px 10px}

/* Hero arena */
.arena{position:relative;margin:16px -16px 0;height:clamp(320px,56vh,480px);overflow:hidden;
  border-top:1px solid rgba(46,230,240,.4);border-bottom:1px solid rgba(255,61,168,.4);
  background:radial-gradient(60% 70% at 50% 60%,rgba(46,230,240,.10),transparent 70%),linear-gradient(180deg,#0A1530,#04070f)}
@media (min-width:560px){.arena{margin:16px 0 0;border:1px solid var(--line);border-radius:14px}}
.stage3d{position:absolute;inset:0}
.stage3d canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;padding:12px 14px;display:flex;flex-direction:column}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.zone{font-weight:700;font-size:15px;text-shadow:0 0 10px rgba(46,230,240,.6)}
.wave{font-size:13px;color:var(--muted)}
.coins{font-weight:700;color:var(--mango);border:1px solid rgba(255,181,71,.5);background:rgba(5,9,19,.6);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,181,71,.6)}
.ebox{margin:10px 0 0 auto;width:min(58%,260px);font-size:13px}
.hbox{margin-top:auto;width:min(58%,260px);font-size:13px}
.hpbar{height:7px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;transition:width .15s linear}
.hpbar.enemy i{background:linear-gradient(90deg,#ff3d6e,var(--magenta));box-shadow:0 0 8px var(--magenta)}
.hpbar.mine i{background:linear-gradient(90deg,var(--grass),var(--cyan));box-shadow:0 0 8px var(--cyan)}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,0);font-weight:700;font-size:16px;animation:fl .95s ease-out forwards;white-space:nowrap;text-shadow:0 0 8px currentColor}
.fl.dmg{color:#fff}.fl.crit{color:var(--mango);font-size:20px}.fl.hurt{color:#ff6b84}.fl.coin{color:var(--mango);font-size:15px}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.arena-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.arena-ctl p{margin:0}
.form-name{font-size:24px;font-weight:700;color:var(--cyan);text-shadow:0 0 12px rgba(46,230,240,.5)}
.forms{display:flex;flex-wrap:wrap;gap:6px}
.formchip{border:1px solid var(--line);background:#070D1C;border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted)}
.formchip.got{border-color:var(--cyan);color:var(--cyan)}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats4 .stat b{font-size:22px;color:var(--ink);margin:2px 0}
.shop{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.shop-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.shop-row+.shop-row{border-top:1px solid var(--line)}
.shop-row small{display:block;color:var(--muted);font-size:13px}
.lv{font-size:12px;color:var(--cyan);border:1px solid rgba(46,230,240,.4);border-radius:4px;padding:0 5px;margin-left:4px}
.eqd{font-size:13px;color:var(--grass);font-weight:700}
.lockt{text-align:right;max-width:52%}
.swatch{width:26px;height:26px;border-radius:6px;flex:none;background:linear-gradient(135deg,var(--sb) 50%,var(--sw) 50%);border:1px solid var(--sw);box-shadow:0 0 8px var(--sw)}
.seg{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected=true]{border-color:var(--magenta);color:var(--ink);box-shadow:var(--glow-m)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(5,9,19,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:90px;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs b{font-size:11px;font-weight:600}
.tabs button[aria-current=page]{color:var(--cyan)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.tabs button[data-tab=hero] svg{stroke:var(--magenta)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0C1428;border:1px solid var(--cyan);box-shadow:var(--glow-c);color:var(--ink);padding:12px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><b>Today</b></button>
  <button data-tab="hero"><svg viewBox="0 0 24 24"><path d="M12 2l3 5-3 3-3-3z"/><path d="M12 10v12M7 14l5-2 5 2M9 22l3-4 3 4"/></svg><b>Hero</b></button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg><b>Train</b></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg><b>Progress</b></button>
  <button data-tab="groceries"><svg viewBox="0 0 24 24"><path d="M4 7h16l-2 12H6z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><b>Market</b></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><b>More</b></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
